name: Generate Terminal GIF

on:
  schedule:
    - cron: '0 6 * * *'   # daily at 06:00 UTC
  workflow_dispatch:
    inputs:
      theme:
        description: 'Theme to use (default | macos | debian)'
        required: false
        default: 'default'
      wallpaper:
        description: 'Wallpaper filename in assets/ for the debian theme (e.g. debian_dark_wallpaper.jpg)'
        required: false
        default: ''
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate-gif:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_TOKEN || github.token }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install github-readme-terminal requests python-dotenv Pillow imageio-ffmpeg
          FFMPEG_BIN=$(python3 -c "import imageio_ffmpeg; print(imageio_ffmpeg.get_ffmpeg_exe())" 2>/dev/null || true)
          if [ -n "$FFMPEG_BIN" ] && [ -x "$FFMPEG_BIN" ]; then
            sudo ln -sf "$FFMPEG_BIN" /usr/local/bin/ffmpeg || true
            sudo ln -sf "$FFMPEG_BIN" /usr/bin/ffmpeg || true
          fi

      - name: Verify FFmpeg
        run: |
          which ffmpeg || true
          ffmpeg -version || true

      - name: Generate GIF
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN || github.token }}
          GITHUB_REPOSITORY_OWNER: ${{ github.repository_owner }}
          THEME: ${{ vars.THEME || inputs.theme || 'debian' }}
          WALLPAPER: ${{ vars.WALLPAPER || inputs.wallpaper || '' }}
        run: |
          echo "Theme: $THEME  |  Wallpaper: ${WALLPAPER:-default}  |  User: $GITHUB_REPOSITORY_OWNER"
          case "$THEME" in
            debian)
              if python3 generate_debian.py 2>&1 | tee generate.log; then
                echo "Successfully generated Debian GIF!"
              else
                echo "Debian theme had an issue, falling back to default theme..."
                python3 generate_with_stats.py 2>&1 | tee -a generate.log
              fi
              ;;
            default) python3 generate_with_stats.py 2>&1 | tee generate.log ;;
            *)       python3 generate_liquid_glass.py 2>&1 | tee generate.log ;;
          esac

      - name: Commit and push if changed
        if: always()
        run: |
          git config --global user.name 'Tomoya Okazaki'
          git config --global user.email 'khalidnawaz7y@gmail.com'
          git add output.gif generate.log || true
          git diff --quiet && git diff --staged --quiet || \
            (git commit -m "chore: Update terminal GIF for Tomoya Okazaki [skip ci]" && git pull --rebase && git push)
